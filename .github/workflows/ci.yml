name: docV.ai CI Pipeline

on:
  push:
    branches:
      - main
      - ci-pipeline-implementation
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - ci-pipeline-implementation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. 🔐 Secret & API Key Leak Prevention
  security-scan:
    name: 🔐 Secret & API Key Leak Prevention (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # 2. ⚡ Frontend CI: Caching, TypeScript, Linting, & Production Build
  frontend-ci:
    name: ⚡ Frontend CI (TypeCheck, Lint, & Build)
    runs-on: ubuntu-latest
    needs: [security-scan]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ⚡ Fast Caching & Speed Optimization
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # 🔍 TypeScript Type Checking
      - name: 🔍 TypeScript Type Checking
        run: npx tsc --noEmit

      # 🧹 Code Quality & Linting
      - name: 🧹 Code Quality & Linting (ESLint)
        run: npm run lint
        continue-on-error: true

      # 🏗️ Production Build Verification
      - name: 🏗️ Production Build Verification
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
